[pytest]
testpaths = tests
faulthandler_timeout = 120
markers =
    models: needs the downloaded models (run scripts/fetch_models.py)
    speech: end-to-end tests on the synthetic multilingual speech fixtures
    verifier: uses the large second-opinion model (slow; set ACOUSTIC_TEST_VERIFIER=1)
filterwarnings =
    ignore::DeprecationWarning
