semantic_reference_phrases:
  - "I am going to send this confidential file to my personal email"
  - "let me copy this data before I leave the company"
  - "don't tell anyone but I'm taking these files with me"
  - "I can get you the internal documents if you pay me"
  - "I'll leak this to a competitor"
  - "save this to a USB drive before IT finds out"
  - "I'm going to upload this to my personal cloud storage"
  - "this stays between us, don't put it in writing"
  - "I know someone who would pay a lot for this information"
  - "delete the logs so nobody knows I accessed this"
  - "forward this to my personal number before they notice"
  - "I'll photograph the screen so there's no digital trail"
  - "یہ خفیہ فائل میں اپنے ذاتی ای میل پر بھیج دوں گا"
  - "کمپنی چھوڑنے سے پہلے میں یہ سارا ڈیٹا کاپی کر لوں گا"
  - "کسی کو مت بتانا، یہ فائلیں میں اپنے ساتھ لے جا رہا ہوں"
  - "اگر تم پیسے دو تو میں تمہیں اندر کی دستاویزات دے سکتا ہوں"
  - "یہ معلومات میں دوسری کمپنی کو لیک کر دوں گا"
  - "آئی ٹی کو پتہ چلنے سے پہلے یہ یو ایس بی میں ڈال لو"
  - "yeh file main apni personal email pe bhej doon ga"
  - "kisi ko mat batana, yeh data main ghar le ja raha hoon"
  - "paise do to main andar ki files de doon ga"
  - "यह गोपनीय फ़ाइल मैं अपने निजी ईमेल पर भेज दूँगा"
  - "किसी को मत बताना, यह डेटा मैं अपने साथ ले जा रहा हूँ"

# Ordinary workplace sharing. The semantic score is the margin between the closest
# exfiltration phrase and the closest of these, so routine collaboration is not flagged.
semantic_benign_phrases:
  - "share the agenda with everyone before the call"
  - "put the presentation on the team folder"
  - "mail the quotation to the customer"
  - "forward the schedule to the department"
  - "upload the approved report to the company portal"
  - "let's go for tea after work"
  - "the weather is lovely today"
  - "I have a doctor's appointment this afternoon"
  - "ٹیم کو میٹنگ کا ایجنڈا بھیج دو"
  - "رپورٹ کمپنی کے فولڈر میں رکھ دو"
  - "شام کو چائے پر چلتے ہیں"
  - "agenda sab ko bhej do meeting se pehle"
  - "टीम को रिपोर्ट भेज दो"

scoring:
  semantic_weight: 0.7
  pattern_weight: 1.0
  repeat_window_seconds: 600
  repeat_escalation_count: 2
  severity_bands:
    critical: 0.85
    high: 0.65
    medium: 0.4
    low: 0.2
