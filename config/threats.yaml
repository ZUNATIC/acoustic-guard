# Acoustic Guard threat registry.
#
# Each category has a base weight (0-1) and a list of phrases. `phrases` holds the English
# forms; `variants` holds the same ideas in other languages/scripts:
#   ur        Urdu (Nastaliq / Arabic script)
#   roman_ur  Roman Urdu, as people actually type and as Whisper often spells it
#   hi        Hindi (Devanagari) - Whisper frequently writes spoken Urdu in Devanagari
#   ar, fa    Arabic, Persian
# A phrase can be a plain string or {text, weight} to override the category weight.
# Matching is case-, punctuation- and diacritic-insensitive and respects word boundaries.

